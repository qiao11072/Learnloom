[package]
name = "learnloom-m0"
version = "0.4.1"
edition = "2021"
rust-version = "1.88"
default-run = "learnloom"
autobins = false

[lib]
name = "learnloom_m0"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]
m0-tools = []

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true , features = [] }

[dependencies]
tauri = { version = "=2.12.5", optional = true , features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
uuid = { version = "=1.29.0", features = ["v4"] }
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util = "=0.7.20"
keyring = { version = "=3.6.3", features = ["windows-native"] }
futures-util = "=0.3.34"

fs2 = "=0.4.3"
tauri-plugin-dialog = { version = "=2.8.3", optional = true }
tauri-plugin-opener = { version = "=2.7.2", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "learnloom"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "m0-probe"
path = "spikes/m0-probe.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m0-search"
path = "spikes/m0-search.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m0-real"
path = "spikes/m0-real.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m0-closeout"
path = "spikes/m0-closeout.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m0-human-real"
path = "spikes/m0-human-real.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m1-acceptance"
path = "spikes/m1-acceptance.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m2-acceptance"
path = "spikes/m2-acceptance.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m3-acceptance"
path = "spikes/m3-acceptance.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m3-explanations"
path = "spikes/m3-explanations.rs"
required-features = ["m0-tools"]

[[bin]]
name = "m4-acceptance"
path = "spikes/m4-acceptance.rs"
required-features = ["m0-tools"]
